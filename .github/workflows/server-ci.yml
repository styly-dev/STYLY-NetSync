name: Server CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "STYLY-NetSync-Server/**"
      - ".github/workflows/server-ci.yml"
  push:
    branches: [develop]
    paths:
      - "STYLY-NetSync-Server/**"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: STYLY-NetSync-Server

env:
  # Pinned uv release (published >= 7 days before adoption)
  UV_VERSION: "0.13.7"

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: STYLY-NetSync-Server/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Black
        run: uv run --no-sync black --check src tests

      - name: Ruff
        run: uv run --no-sync ruff check --output-format=github src tests

      - name: MyPy
        run: uv run --no-sync mypy src

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: STYLY-NetSync-Server/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Pytest
        run: uv run --no-sync pytest --cov=src --cov-report=term --cov-report=xml

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: uv run --no-sync coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: STYLY-NetSync-Server/coverage.xml
          if-no-files-found: error
